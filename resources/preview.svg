<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M75 0 V675 M150 0 V675 M225 0 V675 M300 0 V675 M375 0 V675 M450 0 V675 M525 0 V675 M600 0 V675 M675 0 V675 M750 0 V675 M825 0 V675 M900 0 V675 M975 0 V675 M1050 0 V675 M1125 0 V675" />
  </g>

  <!-- Main Application Container Window -->
  <g filter="url(#shadow)" transform="translate(60, 40)">
    <rect width="1080" height="595" rx="12" fill="#0d1424" stroke="#1e293b" stroke-width="1.5" />

    <!-- Title Bar -->
    <path d="M0 12 Q0 0 12 0 H1068 Q1080 0 1080 12 V44 H0 Z" fill="#0a0f1d" />
    <line x1="0" y1="44" x2="1080" y2="44" stroke="#1e293b" stroke-width="1" />
    <circle cx="28" cy="22" r="5" fill="#ef4444" />
    <circle cx="46" cy="22" r="5" fill="#f59e0b" />
    <circle cx="64" cy="22" r="5" fill="#10b981" />

    <!-- Header Content -->
    <text x="100" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🔍 RepoLens</text>
    <text x="540" y="27" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">Report: tiangolo / fastapi • Generated in 1.4s</text>
    <rect x="940" y="12" width="115" height="22" rx="11" fill="#0284c7" />
    <text x="997" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Share Report ↗</text>

    <!-- Top Summary Banner -->
    <g transform="translate(30, 65)">
      <rect width="1020" height="120" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      
      <!-- Health Score Gauge -->
      <circle cx="70" cy="60" r="42" fill="none" stroke="#1e293b" stroke-width="8" />
      <circle cx="70" cy="60" r="42" fill="none" stroke="url(#scoreGrad)" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="32" stroke-linecap="round" transform="rotate(-90 70 60)" />
      <text x="70" y="66" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle">88</text>
      <text x="70" y="80" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">/ 100</text>

      <!-- Repo Metadata -->
      <text x="140" y="42" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="700">FastAPI — Modern, High-Performance Web Framework</text>
      <text x="140" y="66" fill="#94a3b8" font-family="sans-serif" font-size="12">Production-grade web framework for building APIs with Python 3.8+ based on standard Python type hints.</text>
      
      <!-- Quick Metric Badges -->
      <g transform="translate(140, 84)" font-family="sans-serif" font-size="11">
        <rect x="0" y="0" width="125" height="22" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="10" y="15" fill="#38bdf8">★ 75,400 Stars</text>

        <rect x="135" y="0" width="115" height="22" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="145" y="15" fill="#a855f7">⑂ 6,200 Forks</text>

        <rect x="260" y="0" width="140" height="22" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="270" y="15" fill="#10b981">● High Health Score</text>

        <rect x="410" y="0" width="130" height="22" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="420" y="15" fill="#e2e8f0">MIT Licensed</text>
      </g>
    </g>

    <!-- Lower Left: 7-Point Scoring Breakdown -->
    <g transform="translate(30, 205)">
      <rect width="490" height="360" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      <text x="24" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">7-Point Health Rubric</text>

      <!-- Rubric items -->
      <g transform="translate(24, 60)" font-family="sans-serif" font-size="12">
        <!-- 1 -->
        <text x="0" y="12" fill="#cbd5e1">1. Documentation Completeness</text>
        <rect x="240" y="2" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="2" width="170" height="12" rx="6" fill="#10b981" />
        <text x="435" y="12" fill="#10b981" font-weight="700">95%</text>

        <!-- 2 -->
        <text x="0" y="52" fill="#cbd5e1">2. Commit Rhythm &amp; Recency</text>
        <rect x="240" y="42" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="42" width="160" height="12" rx="6" fill="#10b981" />
        <text x="435" y="52" fill="#10b981" font-weight="700">90%</text>

        <!-- 3 -->
        <text x="0" y="92" fill="#cbd5e1">3. Issue Response Velocity</text>
        <rect x="240" y="82" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="82" width="135" height="12" rx="6" fill="#0284c7" />
        <text x="435" y="92" fill="#0284c7" font-weight="700">75%</text>

        <!-- 4 -->
        <text x="0" y="132" fill="#cbd5e1">4. Test Coverage &amp; Suites</text>
        <rect x="240" y="122" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="122" width="180" height="12" rx="6" fill="#10b981" />
        <text x="435" y="132" fill="#10b981" font-weight="700">100%</text>

        <!-- 5 -->
        <text x="0" y="172" fill="#cbd5e1">5. OSI-Approved License</text>
        <rect x="240" y="162" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="162" width="180" height="12" rx="6" fill="#10b981" />
        <text x="435" y="172" fill="#10b981" font-weight="700">100%</text>

        <!-- 6 -->
        <text x="0" y="212" fill="#cbd5e1">6. Contributor Onboarding Guide</text>
        <rect x="240" y="202" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="202" width="150" height="12" rx="6" fill="#10b981" />
        <text x="435" y="212" fill="#10b981" font-weight="700">85%</text>

        <!-- 7 -->
        <text x="0" y="252" fill="#cbd5e1">7. CI/CD Automated Pipelines</text>
        <rect x="240" y="242" width="180" height="12" rx="6" fill="#1e293b" />
        <rect x="240" y="242" width="165" height="12" rx="6" fill="#10b981" />
        <text x="435" y="252" fill="#10b981" font-weight="700">92%</text>
      </g>
    </g>

    <!-- Lower Right: Interactive Mermaid Architecture Diagram -->
    <g transform="translate(540, 205)">
      <rect width="510" height="360" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      <text x="24" y="34" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Architecture Diagram (Mermaid.js)</text>
      <rect x="420" y="18" width="65" height="22" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" />
      <text x="452" y="33" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">SVG Export</text>

      <!-- Simulated Graph Nodes -->
      <g transform="translate(50, 70)">
        <rect x="130" y="0" width="150" height="38" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
        <text x="205" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">FastAPI Client / UI</text>

        <!-- Arrows -->
        <line x1="205" y1="38" x2="205" y2="78" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />

        <rect x="130" y="80" width="150" height="38" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
        <text x="205" y="104" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Starlette ASGI Core</text>

        <!-- Branch Arrows -->
        <path d="M130 99 H50 V155 H80" fill="none" stroke="#64748b" stroke-width="1.5" />
        <path d="M280 99 H360 V155 H330" fill="none" stroke="#64748b" stroke-width="1.5" />

        <rect x="20" y="160" width="160" height="38" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
        <text x="100" y="184" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pydantic Serialization</text>

        <rect x="230" y="160" width="160" height="38" rx="6" fill="#831843" stroke="#ec4899" stroke-width="1.5" />
        <text x="310" y="184" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Dependency Injection</text>
      </g>
    </g>

  </g>
</svg>

